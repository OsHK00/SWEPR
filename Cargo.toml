[package]
name = "swepr"
version = "1.2.1"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-core = "0.58.0"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    # Lienzo SWEPR: dibujo con Direct2D e imágenes con WIC.
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Foundation_Numerics",
    # Fondo de la pantalla de bloqueo (WinRT).
    "Foundation",
    "Storage",
    "System_UserProfile",
]

# Solo para las pruebas que dibujan la ventana de configuración en un BMP.
[dev-dependencies.windows]
version = "0.58.0"
features = ["Win32_Storage_Xps"]
